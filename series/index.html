<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계열별 안내 | 선택과목 안내서</title>
<link rel="stylesheet" href="../styles/main.css">
<style>
  :root { --c-primary:#1e3a5f; --c-secondary:#1e4d8c; --c-accent:#1e4d8c;
    --c-header-grad:linear-gradient(135deg,#1e3a5f 0%,#1e4d8c 100%);
    --c-hero-grad:linear-gradient(135deg,#ebf4ff,#bfdbfe);
    --c-hero-border:#1e4d8c; --c-chip-hover:#1e4d8c;
    --c-active-bg:#ebf4ff; --c-active-border:#1e4d8c; --c-input-focus:#1e4d8c; }
  .subj-section { margin-bottom:1rem; }
  .subj-section-title { font-size:.73rem; font-weight:700; color:#374151; margin-bottom:.5rem; display:flex; align-items:center; gap:.5rem; }
  .subj-section-title::after { content:""; flex:1; height:1px; background:#e2e8f0; }
  .subject-grid { display:flex; flex-wrap:wrap; gap:.5rem; }
  .subj-badge { background:#e6f0fb; color:#1e3a6e; font-size:.78rem; padding:.28rem .7rem; border-radius:99px; cursor:pointer; border:1px solid #b9d1f0; transition:background .15s; }
  .subj-badge:hover { background:#1e4d8c; color:white; border-color:#1e4d8c; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <a href="../index.html">🏠 홈</a>
    <span class="breadcrumb"> / 계열별 안내</span>
  </div>
  <h1>🎓 계열별 안내</h1>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="계열 검색..." oninput="filterSeries()">
    </div>
    <div class="sidebar-title">전체 계열 (19)</div>
    <div id="seriesList"></div>
  </aside>

  <main class="content" id="contentArea">
    <div class="empty-state">
      <div class="icon">🎓</div>
      <h2>계열을 선택해주세요</h2>
      <p>왼쪽 목록에서 원하는 계열을 클릭하면<br>상세 정보를 확인할 수 있습니다.</p>
    </div>
  </main>
</div>

<script src="../data/data.js"></script>
<script>
const S = EDU_DATA.series;
const STD = EDU_DATA.series_to_depts;
const ICONS = EDU_DATA.series_icons;

let allSeries = Object.keys(S);
let activeKey = null;

const TABLE_ROWS = [
  { label:'국어',                    groups:['국어'] },
  { label:'수학',                    groups:['수학'] },
  { label:'영어',                    groups:['영어'] },
  { label:'사회',                    groups:['사회'] },
  { label:'과학',                    groups:['과학'] },
  { label:'예체능',                  groups:['체육','예술'] },
  { label:'기술·가정<wbr>/정보',     groups:['기술·가정/정보'] },
  { label:'제2외국어<wbr>/한문',     groups:['제2외국어·한문'] },
  { label:'교양',                    groups:['교양'] },
  { label:'전문교과',                groups:['전문교과'] },
];

function getSubjectGroup(name) {
  const S = EDU_DATA.subjects;
  if (S[name]) return S[name].교과군;
  let c = name.replace(/\s*등$/, '').trim();
  if (S[c]) return S[c].교과군;
  c = c.replace(/([가-힣])\s*I\b/g,'$1Ⅰ').replace(/([가-힣])\s*II\b/g,'$1Ⅱ')
       .replace(/([가-힣])\s*1$/,'$1Ⅰ').replace(/([가-힣])\s*2$/,'$1Ⅱ');
  if (S[c]) return S[c].교과군;
  const nosp = c.replace(/\s+/g,'');
  const hit = Object.keys(S).find(k=>k.replace(/\s+/g,'')=== nosp);
  if (hit) return S[hit].교과군;
  if (/제2외국어|한문|일본어|중국어|프랑스어|독일어|스페인어|러시아어|아랍어|베트남어/.test(name)) return '제2외국어·한문';
  if (/기술|정보과학|인공지능|소프트웨어|로봇|데이터/.test(name)) return '기술·가정/정보';
  if (/보건|생태|환경|철학|논리|논술|지식재산|생활과학|심리|종교/.test(name)) return '교양';
  if (/가정|생활|아동/.test(name)) return '기술·가정/정보';
  if (/체육|스포츠/.test(name)) return '체육';
  if (/음악|미술|연극|예술|미디어/.test(name)) return '예술';
  if (/역사|지리|윤리|경제|법|정치|국제|사회/.test(name)) return '사회';
  if (/물리|화학|생명|생물|지구|과학|행성|우주/.test(name)) return '과학';
  if (/수학|미적분|확률|통계|기하|대수/.test(name)) return '수학';
  if (/영어|영미|실생활 영어/.test(name)) return '영어';
  if (/국어|문학|화법|독서|언어|매체|글쓰기|한자/.test(name)) return '국어';
  return null;
}
function buildSubjectTable(generalList, careerList, fusionList, chipClickFn) {
  function groupBy(list) {
    const m = {};
    list.forEach(name => {
      if (name.length > 25 || name.includes(':') || name.includes('\n')) return;
      const g = getSubjectGroup(name);
      if (!g) return;
      if (!m[g]) m[g] = [];
      m[g].push(name);
    });
    return m;
  }
  const gm = groupBy(generalList), cm = groupBy(careerList), fm = groupBy(fusionList);
  const handled = new Set();
  const rows = [];
  TABLE_ROWS.forEach(rd => {
    rd.groups.forEach(g => handled.add(g));
    const gen = rd.groups.flatMap(g => gm[g]||[]);
    const car = rd.groups.flatMap(g => cm[g]||[]);
    const fus = rd.groups.flatMap(g => fm[g]||[]);
    if (gen.length||car.length||fus.length) rows.push({label:rd.label,gen,car,fus});
  });
  new Set([...Object.keys(gm),...Object.keys(cm),...Object.keys(fm)]).forEach(g => {
    if (!handled.has(g)) rows.push({label:g, gen:gm[g]||[], car:cm[g]||[], fus:fm[g]||[]});
  });
  if (!rows.length) return '<p style="color:#64748b;font-size:.85rem;">권장 선택과목 정보가 없습니다.</p>';
  const chip = name => `<span class="subj-chip" onclick="${chipClickFn}('${name.replace(/'/g,"\\'")}') ">${name}</span>`;
  return `<div class="subj-table-wrap"><table class="subj-table">
    <thead><tr>
      <th class="th-group">교과(군)</th>
      <th class="th-general">일반선택</th>
      <th class="th-career">진로선택</th>
      <th class="th-fusion">융합선택</th>
    </tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="td-group">${r.label}</td>
      <td class="td-chips"><div class='chips-wrap'>${r.gen.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.car.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.fus.map(chip).join('')}</div></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function slug(name) {
  return name.replace(/\s+/g,'_').replace(/[·・]/g,'_').replace(/\//g,'-').replace(/[<>:"\\|?*]/g,'');
}

function renderList(keys) {
  const el = document.getElementById('seriesList');
  el.innerHTML = keys.map(k => `
    <div class="series-item ${k===activeKey?'active':''}" onclick="selectSeries('${k.replace(/'/g,"\\'")}')">
      <span class="series-icon">${ICONS[k]||'📁'}</span>
      <span class="series-name">${k}</span>
    </div>
  `).join('');
}

function filterSeries() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q ? allSeries.filter(k=>k.toLowerCase().includes(q)) : allSeries;
  renderList(filtered);
}

function selectSeries(key) {
  location.href = `${slug(key)}/index.html`;
}

function renderDetail(key) {
  const info = S[key];
  const depts = STD[key] || [];
  const icon = ICONS[key] || '📁';

  const general = info.일반선택 ? info.일반선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];
  const career  = info.진로선택 ? info.진로선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];
  const fusion  = info.융합선택 ? info.융합선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];

  const deptLink = d => {
    const exists = EDU_DATA.departments[d];
    return `<span class="dept-chip" onclick="${exists?`location.href='../departments/${slug(d)}/index.html'`:`alert('학과 정보가 준비 중입니다.')`}">${d}</span>`;
  };

  document.getElementById('contentArea').innerHTML = `
    <div class="series-header">
      <div class="big-icon">${icon}</div>
      <div>
        <h2>${key} 계열</h2>
        <p>관련 학과 ${depts.length}개 · 권장 선택과목 ${general.length+career.length+fusion.length}개</p>
      </div>
    </div>

    ${depts.length ? `
    <div class="info-card">
      <h3>🏫 관련 학과</h3>
      <div class="dept-chips">${depts.map(deptLink).join('')}</div>
    </div>` : ''}

    <div class="info-card">
      <h3>📚 권장 선택과목</h3>
      ${buildSubjectTable(general, career, fusion, 'goToSubject')}
    </div>

    ${info.tip ? `
    <div class="tip-box">
      <h3>💡 전공 선택을 위한 Tip</h3>
      <p>${info.tip.replace(/\n/g,'<br>')}</p>
    </div>` : ''}
  `;
}

function goToSubject(name) {
  const sinfo = EDU_DATA.subjects[name];
  const grp = (sinfo && sinfo.교과군) || '기타';
  window.location.href = `../subjects/${slug(grp)}/${slug(name)}/index.html`;
}

// 초기 렌더
renderList(allSeries);

// URL 파라미터로 계열 자동 선택
const urlSeries = new URLSearchParams(location.search).get('series');
if (urlSeries && S[urlSeries]) {
  location.href = `${slug(urlSeries)}/index.html`;
}
</script>
</body>
</html>
