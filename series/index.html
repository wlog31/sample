<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계열별 안내 | 선택과목 안내서</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#f0f4f8; color:#1a202c; }

  .top-bar {
    background: linear-gradient(135deg,#1e3a5f 0%,#2d6a9f 100%);
    color:white; padding: 1rem 1.5rem;
    display:flex; align-items:center; gap:1rem;
  }
  .top-bar a { color:rgba(255,255,255,.75); text-decoration:none; font-size:.85rem; }
  .top-bar a:hover { color:white; }
  .top-bar h1 { font-size:1.1rem; font-weight:700; flex:1; }
  .breadcrumb { font-size:.8rem; opacity:.7; }

  .layout { display:flex; height:calc(100vh - 56px); overflow:hidden; }

  .sidebar {
    width:260px; flex-shrink:0; background:white;
    border-right:1px solid #e2e8f0; overflow-y:auto;
    padding:.5rem 0;
  }
  .sidebar-title {
    font-size:.7rem; font-weight:700; color:#a0aec0;
    letter-spacing:.08em; text-transform:uppercase;
    padding:.8rem 1.2rem .4rem;
  }
  .series-item {
    display:flex; align-items:center; gap:.7rem;
    padding:.65rem 1.2rem; cursor:pointer;
    transition:background .15s; border-left:3px solid transparent;
  }
  .series-item:hover { background:#f7fafc; }
  .series-item.active { background:#ebf4ff; border-left-color:#2d6a9f; font-weight:600; }
  .series-icon { font-size:1.3rem; width:1.8rem; text-align:center; }
  .series-name { font-size:.88rem; }

  .search-box { padding:.6rem 1rem; border-bottom:1px solid #e2e8f0; }
  .search-box input {
    width:100%; padding:.5rem .8rem; border:1px solid #cbd5e0;
    border-radius:8px; font-size:.85rem; outline:none;
  }
  .search-box input:focus { border-color:#2d6a9f; }

  .content { flex:1; overflow-y:auto; padding:2rem; }

  .empty-state {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:#a0aec0; gap:1rem; text-align:center;
  }
  .empty-state .icon { font-size:4rem; }
  .empty-state h2 { font-size:1.1rem; color:#718096; }
  .empty-state p { font-size:.85rem; }

  .series-header {
    display:flex; align-items:center; gap:1rem;
    margin-bottom:1.5rem;
  }
  .series-header .big-icon { font-size:2.5rem; }
  .series-header h2 { font-size:1.6rem; font-weight:800; }
  .series-header p { font-size:.85rem; color:#718096; margin-top:.2rem; }

  .info-card {
    background:white; border-radius:14px;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
    padding:1.5rem; margin-bottom:1.2rem;
  }
  .info-card h3 {
    font-size:.8rem; font-weight:700; color:#2d6a9f;
    letter-spacing:.06em; text-transform:uppercase;
    margin-bottom:.8rem; display:flex; align-items:center; gap:.4rem;
  }
  .info-card p { font-size:.88rem; line-height:1.7; color:#4a5568; }

  .dept-chips { display:flex; flex-wrap:wrap; gap:.5rem; }
  .dept-chip {
    background:#e6f0fb; color:#1e4d8c; font-size:.78rem;
    padding:.3rem .8rem; border-radius:99px;
    cursor:pointer; border:1px solid #b9d1f0;
    transition:background .15s;
  }
  .dept-chip:hover { background:#2d6a9f; color:white; }

  .tip-box {
    background:linear-gradient(135deg,#fffbeb,#fef3c7);
    border:1px solid #f6d860; border-radius:12px;
    padding:1.2rem 1.5rem;
  }
  .tip-box h3 { color:#b7791f; font-size:.8rem; font-weight:700; margin-bottom:.6rem; }
  .tip-box p { font-size:.85rem; color:#744210; line-height:1.7; white-space:pre-line; }

  /* Subject table */
  .subj-table-wrap { overflow-x:auto; border-radius:10px; border:1px solid #e2e8f0; }
  .subj-table { width:100%; border-collapse:collapse; font-size:.82rem; table-layout:fixed; }
  .subj-table th { padding:.6rem .8rem; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-align:left; border-bottom:2px solid #e2e8f0; }
  .th-group { background:#f7fafc; color:#718096; width:90px; }
  .th-general { background:#dbeafe; color:#1e40af; width:30%; }
  .th-career  { background:#dcfce7; color:#166534; width:30%; }
  .th-fusion  { background:#fce7f3; color:#9d174d; width:30%; }
  .subj-table td { padding:.5rem .6rem; vertical-align:top; border-bottom:1px solid #f0f4f8; border-right:1px solid #e2e8f0; }
  .subj-table td:last-child { border-right:none; }
  .td-group { font-size:.73rem; font-weight:700; color:#4a5568; background:#f7fafc; white-space:nowrap; }
  .td-chips { }
  .chips-wrap { display:flex; flex-wrap:wrap; gap:.3rem; align-content:flex-start; }
  .subj-chip { background:#edf2f7; color:#2d3748; font-size:.75rem; padding:.2rem .6rem; border-radius:99px; text-decoration:none; border:1px solid #e2e8f0; cursor:pointer; transition:background .15s; display:inline-block; white-space:nowrap; }
  @media(max-width:600px){ .subj-table { font-size:.72rem; } .subj-chip { white-space:normal; word-break:keep-all; font-size:.7rem; padding:.15rem .4rem; } .td-chips { overflow:hidden; } .th-group { width:56px; } }
  .subj-chip:hover { background:#2d6a9f; color:white; border-color:#2d6a9f; }
  .subj-table tr:last-child td { border-bottom:none; }

  @media(max-width:700px){
    .layout { flex-direction:column; height:auto; }
    .sidebar { width:100%; border-right:none; border-bottom:1px solid #e2e8f0; max-height:200px; }
    .content { padding:1rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <a href="../index.html">🏠 홈</a>
    <span class="breadcrumb"> / 계열별 안내</span>
  </div>
  <h1>🎓 계열별 안내</h1>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="계열 검색..." oninput="filterSeries()">
    </div>
    <div class="sidebar-title">전체 계열 (19)</div>
    <div id="seriesList"></div>
  </aside>

  <main class="content" id="contentArea">
    <div class="empty-state">
      <div class="icon">🎓</div>
      <h2>계열을 선택해주세요</h2>
      <p>왼쪽 목록에서 원하는 계열을 클릭하면<br>상세 정보를 확인할 수 있습니다.</p>
    </div>
  </main>
</div>

<script src="../data/data.js"></script>
<script>
const S = EDU_DATA.series;
const STD = EDU_DATA.series_to_depts;
const ICONS = EDU_DATA.series_icons;

let allSeries = Object.keys(S);
let activeKey = null;

const TABLE_ROWS = [
  { label:'국어',           groups:['국어'] },
  { label:'수학',           groups:['수학'] },
  { label:'영어',           groups:['영어'] },
  { label:'사회',           groups:['사회'] },
  { label:'과학',           groups:['과학'] },
  { label:'예체능',         groups:['체육','예술'] },
  { label:'기술·가정/정보', groups:['기술·가정/정보'] },
  { label:'제2외국어/한문', groups:['제2외국어·한문'] },
  { label:'교양',           groups:['교양'] },
  { label:'전문교과',       groups:['전문교과'] },
];

function buildSubjectTable(generalList, careerList, fusionList, chipClickFn) {
  function groupBy(list) {
    const m = {};
    list.forEach(name => {
      const g = (EDU_DATA.subjects[name] && EDU_DATA.subjects[name].교과군) || '기타';
      if (!m[g]) m[g] = [];
      m[g].push(name);
    });
    return m;
  }
  const gm = groupBy(generalList), cm = groupBy(careerList), fm = groupBy(fusionList);
  const handled = new Set();
  const rows = [];
  TABLE_ROWS.forEach(rd => {
    rd.groups.forEach(g => handled.add(g));
    const gen = rd.groups.flatMap(g => gm[g]||[]);
    const car = rd.groups.flatMap(g => cm[g]||[]);
    const fus = rd.groups.flatMap(g => fm[g]||[]);
    if (gen.length||car.length||fus.length) rows.push({label:rd.label,gen,car,fus});
  });
  new Set([...Object.keys(gm),...Object.keys(cm),...Object.keys(fm)]).forEach(g => {
    if (!handled.has(g)) rows.push({label:g, gen:gm[g]||[], car:cm[g]||[], fus:fm[g]||[]});
  });
  if (!rows.length) return '<p style="color:#a0aec0;font-size:.85rem;">권장 선택과목 정보가 없습니다.</p>';
  const chip = name => `<span class="subj-chip" onclick="${chipClickFn}('${name.replace(/'/g,"\\'")}') ">${name}</span>`;
  return `<div class="subj-table-wrap"><table class="subj-table">
    <thead><tr>
      <th class="th-group">교과(군)</th>
      <th class="th-general">일반선택</th>
      <th class="th-career">진로선택</th>
      <th class="th-fusion">융합선택</th>
    </tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="td-group">${r.label}</td>
      <td class="td-chips"><div class='chips-wrap'>${r.gen.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.car.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.fus.map(chip).join('')}</div></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function slug(name) {
  return name.replace(/\s+/g,'_').replace(/[·・]/g,'_').replace(/\//g,'-').replace(/[<>:"\\|?*]/g,'');
}

function renderList(keys) {
  const el = document.getElementById('seriesList');
  el.innerHTML = keys.map(k => `
    <div class="series-item ${k===activeKey?'active':''}" onclick="selectSeries('${k.replace(/'/g,"\\'")}')">
      <span class="series-icon">${ICONS[k]||'📁'}</span>
      <span class="series-name">${k}</span>
    </div>
  `).join('');
}

function filterSeries() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q ? allSeries.filter(k=>k.toLowerCase().includes(q)) : allSeries;
  renderList(filtered);
}

function selectSeries(key) {
  location.href = `${slug(key)}/index.html`;
}

function renderDetail(key) {
  const info = S[key];
  const depts = STD[key] || [];
  const icon = ICONS[key] || '📁';

  const general = info.일반선택 ? info.일반선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];
  const career  = info.진로선택 ? info.진로선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];
  const fusion  = info.융합선택 ? info.융합선택.split('，').flatMap(s=>s.split(',')).map(s=>s.trim()).filter(Boolean) : [];

  const deptLink = d => {
    const exists = EDU_DATA.departments[d];
    return `<span class="dept-chip" onclick="${exists?`location.href='../departments/${slug(d)}/index.html'`:`alert('학과 정보가 준비 중입니다.')`}">${d}</span>`;
  };

  document.getElementById('contentArea').innerHTML = `
    <div class="series-header">
      <div class="big-icon">${icon}</div>
      <div>
        <h2>${key} 계열</h2>
        <p>관련 학과 ${depts.length}개 · 권장 선택과목 ${general.length+career.length+fusion.length}개</p>
      </div>
    </div>

    ${depts.length ? `
    <div class="info-card">
      <h3>🏫 관련 학과</h3>
      <div class="dept-chips">${depts.map(deptLink).join('')}</div>
    </div>` : ''}

    <div class="info-card">
      <h3>📚 권장 선택과목</h3>
      ${buildSubjectTable(general, career, fusion, 'goToSubject')}
    </div>

    ${info.tip ? `
    <div class="tip-box">
      <h3>💡 전공 선택을 위한 Tip</h3>
      <p>${info.tip.replace(/\n/g,'<br>')}</p>
    </div>` : ''}
  `;
}

function goToSubject(name) {
  const sinfo = EDU_DATA.subjects[name];
  const grp = (sinfo && sinfo.교과군) || '기타';
  window.location.href = `../subjects/${slug(grp)}/${slug(name)}/index.html`;
}

// 초기 렌더
renderList(allSeries);

// URL 파라미터로 계열 자동 선택
const urlSeries = new URLSearchParams(location.search).get('series');
if (urlSeries && S[urlSeries]) {
  location.href = `${slug(urlSeries)}/index.html`;
}
</script>
</body>
</html>
