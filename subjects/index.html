<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선택과목별 안내 | 선택과목 안내서</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#f0f4f8; color:#1a202c; }

  .top-bar {
    background: linear-gradient(135deg,#5c3a1a 0%,#e07b2a 100%);
    color:white; padding:1rem 1.5rem;
    display:flex; align-items:center; gap:1rem;
  }
  .top-bar a { color:rgba(255,255,255,.75); text-decoration:none; font-size:.85rem; }
  .top-bar a:hover { color:white; }
  .top-bar h1 { font-size:1.1rem; font-weight:700; flex:1; }
  .breadcrumb { font-size:.8rem; opacity:.7; }

  .layout { display:flex; height:calc(100vh - 56px); overflow:hidden; }

  .sidebar {
    width:260px; flex-shrink:0; background:white;
    border-right:1px solid #e2e8f0;
    display:flex; flex-direction:column; overflow:hidden;
  }

  .filter-panel { padding:.7rem 1rem; border-bottom:1px solid #e2e8f0; background:#fafafa; }
  .filter-panel label { font-size:.72rem; font-weight:700; color:#718096; display:block; margin-bottom:.35rem; }
  .type-btns { display:grid; grid-template-columns:1fr; gap:.3rem; }
  .type-btns-row2 { display:grid; grid-template-columns:repeat(3,1fr); gap:.3rem; margin-top:.3rem; }
  .type-btn {
    padding:.35rem .3rem; font-size:.72rem;
    border:1px solid #e2e8f0; border-radius:6px; cursor:pointer;
    background:white; text-align:center; transition:all .15s;
    font-family:inherit; width:100%;
  }
  .type-btn.active-general { background:#dbeafe; border-color:#93c5fd; color:#1e40af; font-weight:700; }
  .type-btn.active-career  { background:#dcfce7; border-color:#86efac; color:#166534; font-weight:700; }
  .type-btn.active-fusion  { background:#fce7f3; border-color:#f9a8d4; color:#9d174d; font-weight:700; }
  .type-btn.active-all     { background:#e2e8f0; border-color:#a0aec0; color:#2d3748; font-weight:700; }

  .group-tabs { overflow-y:auto; flex-shrink:0; border-bottom:1px solid #e2e8f0; max-height:22vh; }
  .group-tab {
    display:flex; align-items:center; gap:.5rem;
    padding:.55rem 1rem; cursor:pointer; font-size:.83rem;
    border-left:3px solid transparent; transition:background .15s;
  }
  .group-tab:hover { background:#fef3ec; }
  .group-tab.active { background:#fff5eb; border-left-color:#e07b2a; font-weight:600; }

  .search-box { padding:.6rem 1rem; border-bottom:1px solid #e2e8f0; }
  .search-box input {
    width:100%; padding:.45rem .75rem; border:1px solid #cbd5e0;
    border-radius:8px; font-size:.83rem; outline:none;
  }
  .search-box input:focus { border-color:#e07b2a; }

  .subject-list { flex:1; overflow-y:auto; padding:.3rem 0; }
  .subj-item {
    padding:.55rem 1rem; cursor:pointer; font-size:.85rem;
    border-left:3px solid transparent; transition:background .15s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .subj-item:hover { background:#fef9f5; }
  .subj-item.active { background:#fff5eb; border-left-color:#e07b2a; font-weight:600; }
  .subj-item-name { flex:1; }
  .subj-type-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-left:.5rem;
  }
  .dot-general { background:#93c5fd; }
  .dot-career  { background:#86efac; }
  .dot-fusion  { background:#f9a8d4; }
  .dot-other   { background:#cbd5e0; }
  .list-count { font-size:.68rem; color:#a0aec0; padding:.3rem 1rem; }

  .content { flex:1; overflow-y:auto; padding:2rem; }

  .empty-state {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:#a0aec0; gap:1rem; text-align:center;
  }
  .empty-state .icon { font-size:4rem; }
  .empty-state h2 { font-size:1.1rem; color:#718096; }

  @media(max-width:700px){
    .layout { flex-direction:column; height:auto; }
    .sidebar {
      width:100%; border-right:none; border-bottom:1px solid #e2e8f0;
      max-height:none; height:auto;
    }
    .group-tabs { max-height:28vw; min-height:60px; }
    .subject-list { max-height:38vh; min-height:120px; }
    .content { padding:1rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <a href="../index.html">🏠 홈</a>
    <span class="breadcrumb"> / 선택과목별 안내</span>
  </div>
  <h1>📋 선택과목별 안내</h1>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="filter-panel">
      <label>과목 유형 필터</label>
      <div class="type-btns">
        <button class="type-btn active-all" onclick="setType('all',this)">전체</button>
      </div>
      <div class="type-btns-row2">
        <button class="type-btn" onclick="setType('일반선택',this)">일반선택</button>
        <button class="type-btn" onclick="setType('진로선택',this)">진로선택</button>
        <button class="type-btn" onclick="setType('융합선택',this)">융합선택</button>
      </div>
    </div>

    <div class="group-tabs" id="groupTabs"></div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="과목명 검색..." oninput="filterSubjects()">
    </div>
    <div class="list-count" id="listCount"></div>

    <div class="subject-list" id="subjList"></div>
  </aside>

  <main class="content" id="contentArea">
    <div class="empty-state">
      <div class="icon">📋</div>
      <h2>과목을 선택해주세요</h2>
      <p>왼쪽에서 교과군을 선택하고<br>과목을 클릭하면 상세 정보를 볼 수 있습니다.</p>
    </div>
  </main>
</div>

<script src="../data/data.js"></script>
<script>
const SUBS = EDU_DATA.subjects;
const GROUPS = EDU_DATA.subject_groups;

const GROUP_ICONS = {
  '국어':'📗','수학':'📐','영어':'🌐','사회':'🗺️','과학':'🔬',
  '체육':'🏃','예술':'🎨','기술·가정/정보':'💡','제2외국어·한문':'🈳',
  '교양':'🌿','전문교과':'⭐'
};

let currentGroup = '전체';
let currentType  = 'all';
let activeSubj   = null;

function slug(name) {
  return name.replace(/\s+/g,'_').replace(/[·・]/g,'_').replace(/\//g,'-').replace(/[<>:"\\|?*]/g,'');
}

function renderGroupTabs() {
  const el = document.getElementById('groupTabs');
  const groups = ['전체', ...GROUPS];
  el.innerHTML = groups.map(g => `
    <div class="group-tab ${g===currentGroup?'active':''}" onclick="setGroup('${g}')">
      <span>${GROUP_ICONS[g]||'📁'}</span>
      <span>${g}</span>
    </div>`).join('');
}

function setGroup(g) {
  currentGroup = g;
  activeSubj = null;
  renderGroupTabs();
  filterSubjects();
  document.getElementById('contentArea').innerHTML = `
    <div class="empty-state">
      <div class="icon">📋</div>
      <h2>과목을 선택해주세요</h2>
      <p>왼쪽 목록에서 과목을 클릭하세요.</p>
    </div>`;
}

function setType(t, btn) {
  currentType = t;
  document.querySelectorAll('.type-btn').forEach(b => b.className = 'type-btn');
  if (t==='all')     btn.classList.add('active-all');
  else if (t==='일반선택') btn.classList.add('active-general');
  else if (t==='진로선택') btn.classList.add('active-career');
  else if (t==='융합선택') btn.classList.add('active-fusion');
  filterSubjects();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return Object.entries(SUBS).filter(([name, info]) => {
    if (currentGroup !== '전체' && info.교과군 !== currentGroup) return false;
    if (currentType  !== 'all'  && info.구분 !== currentType) return false;
    if (q && !name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function typeDot(t) {
  if (t==='일반선택') return 'dot-general';
  if (t==='진로선택') return 'dot-career';
  if (t==='융합선택') return 'dot-fusion';
  return 'dot-other';
}

function filterSubjects() {
  const items = getFiltered();
  const el = document.getElementById('subjList');
  document.getElementById('listCount').textContent = `${items.length}개 과목`;

  if (!items.length) {
    el.innerHTML = `<div style="padding:1.5rem;text-align:center;color:#a0aec0;font-size:.83rem;">해당 과목이 없습니다.</div>`;
    return;
  }
  el.innerHTML = items.map(([name, info]) => `
    <div class="subj-item ${name===activeSubj?'active':''}" onclick="selectSubject('${name.replace(/'/g,"\\'")}')">
      <span class="subj-item-name">${name}</span>
      <span class="subj-type-dot ${typeDot(info.구분)}"></span>
    </div>`).join('');
}

function selectSubject(name) {
  const info = SUBS[name];
  if (!info) return;
  const grp = info.교과군 || '기타';
  location.href = `${slug(grp)}/${slug(name)}/index.html`;
}

// 초기화
renderGroupTabs();
filterSubjects();

// URL 파라미터
const params = new URLSearchParams(location.search);
const paramSubj = params.get('subject');
if (paramSubj && SUBS[paramSubj]) {
  const info = SUBS[paramSubj];
  const grp = info.교과군 || '기타';
  location.href = `${slug(grp)}/${slug(paramSubj)}/index.html`;
}
</script>
</body>
</html>
