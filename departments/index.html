<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학과별 안내 | 선택과목 안내서</title>
<link rel="stylesheet" href="../styles/main.css">
<style>
  :root { --c-primary:#1a5c3a; --c-secondary:#166534; --c-accent:#166534;
    --c-header-grad:linear-gradient(135deg,#1a5c3a 0%,#166534 100%);
    --c-hero-grad:linear-gradient(135deg,#f0fff4,#c6f6d5);
    --c-hero-border:#166534; --c-chip-hover:#166534;
    --c-active-bg:#e6f4f0; --c-active-border:#166534; --c-input-focus:#166534; }
  /* 사이드바 전용 */
  .series-selector { padding:.8rem 1rem; border-bottom:1px solid #e2e8f0; background:#f7fafc; }
  .series-selector label { font-size:.75rem; font-weight:700; color:#374151; display:block; margin-bottom:.4rem; }
  .series-selector select { width:100%; padding:.5rem .8rem; border:1px solid #cbd5e0; border-radius:8px; font-size:.88rem; outline:none; background:white; cursor:pointer; font-family:inherit; }
  .series-selector select:focus { border-color:#166534; }
  .dept-list { flex:1; overflow-y:auto; padding:.4rem 0; }
  .sidebar-section-title { font-size:.68rem; font-weight:700; color:#64748b; letter-spacing:.08em; padding:.5rem 1rem .2rem; }
  .dept-count { font-size:.7rem; color:#64748b; margin-left:.4rem; }
  /* 학과 구분 섹션 */
  .subj-section { margin-bottom:1rem; }
  .subj-section-title { font-size:.73rem; font-weight:700; color:#374151; margin-bottom:.5rem; display:flex; align-items:center; gap:.5rem; }
  .subj-section-title::after { content:""; flex:1; height:1px; background:#e2e8f0; }
  .subject-grid { display:flex; flex-wrap:wrap; gap:.5rem; }
  .subj-badge { background:#e6f4f0; color:#14532d; font-size:.78rem; padding:.28rem .7rem; border-radius:99px; cursor:pointer; border:1px solid #b2dfdb; transition:background .15s; }
  .subj-badge:hover { background:#166534; color:white; border-color:#166534; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <a href="../index.html">🏠 홈</a>
    <span class="breadcrumb"> / 학과별 안내</span>
  </div>
  <h1>🏫 학과별 안내</h1>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="series-selector">
      <label>① 계열 선택</label>
      <select id="seriesSelect" onchange="onSeriesChange()">
        <option value="">── 계열을 선택하세요 ──</option>
      </select>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="학과 검색..." oninput="filterDepts()">
    </div>
    <div class="dept-list" id="deptList">
      <div style="padding:1.5rem;text-align:center;color:#64748b;font-size:.83rem;">계열을 먼저 선택해주세요</div>
    </div>
  </aside>

  <main class="content" id="contentArea">
    <div class="empty-state">
      <div class="icon">🏫</div>
      <h2>학과를 선택해주세요</h2>
      <p>왼쪽에서 계열과 학과를 선택하면<br>상세 정보를 확인할 수 있습니다.</p>
    </div>
  </main>
</div>

<script src="../data/data.js"></script>
<script>
const D = EDU_DATA.departments;
const STD = EDU_DATA.series_to_depts;
const ICONS = EDU_DATA.series_icons;

let currentSeries = '';
let activeDept = null;

const TABLE_ROWS = [
  { label:'국어',                    groups:['국어'] },
  { label:'수학',                    groups:['수학'] },
  { label:'영어',                    groups:['영어'] },
  { label:'사회',                    groups:['사회'] },
  { label:'과학',                    groups:['과학'] },
  { label:'예체능',                  groups:['체육','예술'] },
  { label:'기술·가정<wbr>/정보',     groups:['기술·가정/정보'] },
  { label:'제2외국어<wbr>/한문',     groups:['제2외국어·한문'] },
  { label:'교양',                    groups:['교양'] },
  { label:'전문교과',                groups:['전문교과'] },
];

function getSubjectGroup(name) {
  const S = EDU_DATA.subjects;
  if (S[name]) return S[name].교과군;
  let c = name.replace(/\s*등$/, '').trim();
  if (S[c]) return S[c].교과군;
  c = c.replace(/([가-힣])\s*I\b/g,'$1Ⅰ').replace(/([가-힣])\s*II\b/g,'$1Ⅱ')
       .replace(/([가-힣])\s*1$/,'$1Ⅰ').replace(/([가-힣])\s*2$/,'$1Ⅱ');
  if (S[c]) return S[c].교과군;
  const nosp = c.replace(/\s+/g,'');
  const hit = Object.keys(S).find(k=>k.replace(/\s+/g,'')=== nosp);
  if (hit) return S[hit].교과군;
  if (/제2외국어|한문|일본어|중국어|프랑스어|독일어|스페인어|러시아어|아랍어|베트남어/.test(name)) return '제2외국어·한문';
  if (/기술|정보과학|인공지능|소프트웨어|로봇|데이터/.test(name)) return '기술·가정/정보';
  if (/보건|생태|환경|철학|논리|논술|지식재산|생활과학|심리|종교/.test(name)) return '교양';
  if (/가정|생활|아동/.test(name)) return '기술·가정/정보';
  if (/체육|스포츠/.test(name)) return '체육';
  if (/음악|미술|연극|예술|미디어/.test(name)) return '예술';
  if (/역사|지리|윤리|경제|법|정치|국제|사회/.test(name)) return '사회';
  if (/물리|화학|생명|생물|지구|과학|행성|우주/.test(name)) return '과학';
  if (/수학|미적분|확률|통계|기하|대수/.test(name)) return '수학';
  if (/영어|영미|실생활 영어/.test(name)) return '영어';
  if (/국어|문학|화법|독서|언어|매체|글쓰기|한자/.test(name)) return '국어';
  return null;
}
function buildSubjectTable(generalList, careerList, fusionList, chipClickFn) {
  function groupBy(list) {
    const m = {};
    list.forEach(name => {
      if (name.length > 25 || name.includes(':') || name.includes('\n')) return;
      const g = getSubjectGroup(name);
      if (!g) return;
      if (!m[g]) m[g] = [];
      m[g].push(name);
    });
    return m;
  }
  const gm = groupBy(generalList), cm = groupBy(careerList), fm = groupBy(fusionList);
  const handled = new Set();
  const rows = [];
  TABLE_ROWS.forEach(rd => {
    rd.groups.forEach(g => handled.add(g));
    const gen = rd.groups.flatMap(g => gm[g]||[]);
    const car = rd.groups.flatMap(g => cm[g]||[]);
    const fus = rd.groups.flatMap(g => fm[g]||[]);
    if (gen.length||car.length||fus.length) rows.push({label:rd.label,gen,car,fus});
  });
  new Set([...Object.keys(gm),...Object.keys(cm),...Object.keys(fm)]).forEach(g => {
    if (!handled.has(g)) rows.push({label:g, gen:gm[g]||[], car:cm[g]||[], fus:fm[g]||[]});
  });
  if (!rows.length) return '<p style="color:#64748b;font-size:.85rem;">권장 선택과목 정보가 없습니다.</p>';
  const chip = name => `<span class="subj-chip" onclick="${chipClickFn}('${name.replace(/'/g,"\\'")}') ">${name}</span>`;
  return `<div class="subj-table-wrap"><table class="subj-table">
    <thead><tr>
      <th class="th-group">교과(군)</th>
      <th class="th-general">일반선택</th>
      <th class="th-career">진로선택</th>
      <th class="th-fusion">융합선택</th>
    </tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="td-group">${r.label}</td>
      <td class="td-chips"><div class='chips-wrap'>${r.gen.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.car.map(chip).join('')}</div></td>
      <td class="td-chips"><div class='chips-wrap'>${r.fus.map(chip).join('')}</div></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

// 계열 셀렉트 채우기
const sel = document.getElementById('seriesSelect');
Object.keys(STD).forEach(k => {
  const op = document.createElement('option');
  op.value = k; op.textContent = `${ICONS[k]||''} ${k}`;
  sel.appendChild(op);
});

function slug(name) {
  return name.replace(/\s+/g,'_').replace(/[·・]/g,'_').replace(/\//g,'-').replace(/[<>:"\\|?*]/g,'');
}

function onSeriesChange() {
  currentSeries = sel.value;
  activeDept = null;
  filterDepts();
  document.getElementById('contentArea').innerHTML = `
    <div class="empty-state">
      <div class="icon">🏫</div>
      <h2>학과를 선택해주세요</h2>
      <p>왼쪽 목록에서 학과를 클릭하세요.</p>
    </div>`;
}

function getDepts() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!currentSeries && !q) return [];
  let pool = currentSeries ? (STD[currentSeries] || []) : Object.keys(D);
  if (q) pool = Object.keys(D).filter(n => n.includes(q));
  return pool.filter(n => D[n]);
}

function filterDepts() {
  const depts = getDepts();
  const el = document.getElementById('deptList');
  if (!depts.length) {
    el.innerHTML = `<div style="padding:1.5rem;text-align:center;color:#64748b;font-size:.83rem;">
      ${currentSeries ? '해당 계열의 학과 정보가 없습니다.' : '계열을 선택하거나 학과명을 검색하세요.'}</div>`;
    return;
  }
  el.innerHTML = `<div class="sidebar-section-title">${currentSeries || '검색결과'} (${depts.length})</div>` +
    depts.map(d => `
      <div class="dept-item ${d===activeDept?'active':''}" onclick="selectDept('${d.replace(/'/g,"\\'")}')">
        ${d}
      </div>`).join('');
}

function selectDept(name) {
  location.href = `${slug(name)}/index.html`;
}

function renderDept(name) {
  const info = D[name];
  if (!info) return;

  const general = info.일반선택 ? info.일반선택.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const career  = info.진로선택 ? info.진로선택.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const fusion  = info.융합선택 ? info.융합선택.split(',').map(s=>s.trim()).filter(Boolean) : [];

  const univHTML = (str) => {
    if (!str) return '<span style="color:#64748b;font-size:.8rem;">정보 없음</span>';
    return str.split(',').map(u=>u.trim()).filter(Boolean)
      .map(u=>`<span class="univ-chip">${u}</span>`).join('');
  };

  const similar = info.유사학과 ? info.유사학과.split(',').map(s=>s.trim()).filter(Boolean) : [];

  document.getElementById('contentArea').innerHTML = `
    <div class="dept-header">
      <h2>🏫 ${name}</h2>
      <div class="meta">
        ${currentSeries ? `${ICONS[currentSeries]||''} ${currentSeries} 계열 · ` : ''}
        ${(general.length+career.length+fusion.length)}개 권장 선택과목
      </div>
    </div>

    ${info.학과설명 ? `
    <div class="info-card">
      <h3>📌 학과 소개</h3>
      <p>${info.학과설명}</p>
    </div>` : ''}

    ${info.추천학생 ? `
    <div class="info-card">
      <h3>✅ 이런 학생에게 추천</h3>
      <p>${info.추천학생.replace(/\n/g,'<br>')}</p>
    </div>` : ''}

    ${(general.length||career.length||fusion.length) ? `
    <div class="info-card">
      <h3>📚 권장 고교 선택과목</h3>
      ${buildSubjectTable(general, career, fusion, 'goToSubject')}
    </div>` : ''}

    ${info.전공기초 ? `
    <div class="info-card">
      <h3>📖 주요 전공 교과목</h3>
      <p>${info.전공기초.replace(/\n/g,'<br>')}</p>
    </div>` : ''}

    ${(info.개설대학_서울||info.개설대학_수도권||info.개설대학_지방) ? `
    <div class="info-card">
      <h3>🏛️ 개설 대학</h3>
      ${info.개설대학_서울 ? `<p style="font-size:.75rem;font-weight:700;color:#1f2937;margin-bottom:.4rem;">서울</p>
        <div class="univ-grid" style="margin-bottom:.8rem;">${univHTML(info.개설대학_서울)}</div>` : ''}
      ${info.개설대학_수도권 ? `<p style="font-size:.75rem;font-weight:700;color:#1f2937;margin-bottom:.4rem;">수도권</p>
        <div class="univ-grid" style="margin-bottom:.8rem;">${univHTML(info.개설대학_수도권)}</div>` : ''}
      ${info.개설대학_지방 ? `<p style="font-size:.75rem;font-weight:700;color:#1f2937;margin-bottom:.4rem;">지방</p>
        <div class="univ-grid">${univHTML(info.개설대학_지방)}</div>` : ''}
    </div>` : ''}

    ${info.졸업후진로 ? `
    <div class="info-card">
      <h3>🚀 졸업 후 진로</h3>
      <p>${info.졸업후진로.replace(/\n/g,'<br>')}</p>
    </div>` : ''}

    ${similar.length ? `
    <div class="info-card">
      <h3>🔗 유사 학과</h3>
      <div>${similar.map(s=>`<span class="similar-chip" onclick="goToDept('${s.replace(/'/g,"\\'")}') ">${s}</span>`).join('')}</div>
    </div>` : ''}
  `;
}

function goToSubject(name) {
  const sinfo = EDU_DATA.subjects[name];
  const grp = (sinfo && sinfo.교과군) || '기타';
  window.location.href = `../subjects/${slug(grp)}/${slug(name)}/index.html`;
}

function goToDept(name) {
  window.location.href = `${slug(name)}/index.html`;
}

// URL 파라미터 처리
const params = new URLSearchParams(location.search);
const paramDept = params.get('dept');
const paramSeries = params.get('series');

if (paramDept && D[paramDept]) {
  // redirect to individual page
  location.href = `${slug(paramDept)}/index.html`;
} else if (paramSeries && STD[paramSeries]) {
  sel.value = paramSeries;
  currentSeries = paramSeries;
  filterDepts();
}
</script>
</body>
</html>
